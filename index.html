
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaFlow AI - Pro Scriptwriter Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Myanmar Font Integration */
    @font-face {
      font-family: 'Pyidaungsu';
      src: url('https://raw.githubusercontent.com/googlefonts/noto-fonts/main/unhinted/ttf/NotoSansMyanmar/NotoSansMyanmar-Regular.ttf');
    }

    :root {
      /* Default Dark Mode Variables */
      --bg-color: #000000;
      --card-bg: #111111;
      --element-bg: #1A1A1A;
      --border-color: #222222;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --text-secondary: #666666;
      --divider-color: #111111;
      --glass-bg: rgba(8, 8, 8, 0.8);
      --glass-border: #111111;
    }

    /* Light Mode Overrides */
    body.light-mode {
      --bg-color: #F8FAFC;       /* Slate 50 */
      --card-bg: #FFFFFF;        /* White */
      --element-bg: #F1F5F9;     /* Slate 100 */
      --border-color: #E2E8F0;   /* Slate 200 */
      --text-main: #0F172A;      /* Slate 900 */
      --text-muted: #475569;     /* Slate 600 */
      --text-secondary: #64748B; /* Slate 500 */
      --divider-color: #E2E8F0;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: #E2E8F0;
    }

    body {
      font-family: 'Inter', 'Pyidaungsu', 'Noto Sans Myanmar', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Ensuring text inherits globally */
    * {
      color: inherit;
      border-color: var(--border-color);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 40px rgba(0, 0, 0, 0.1);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: var(--bg-color);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--element-bg);
      border-radius: 10px;
    }

    .safe-area {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-flutter-fade {
      animation: fadeIn 0.5s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
    }

    input, textarea, select {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--border-color);
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
