# Render Blueprint — deploys GeniusAiStudio as a single Node web service.
# In Render: New > Blueprint > connect your repo containing this file.
services:
  - type: web
    name: linguaflow-ai
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      # Optional fallback key (leave empty if unused):
      # - key: MY_GEMINI_API_KEY
      #   sync: false
